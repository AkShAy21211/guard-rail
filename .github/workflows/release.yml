name: Release

# Changesets-driven release: every push to main either opens/updates a
# "Version Packages" PR (if there are pending changesets) or, once that PR
# is merged (so the version bump itself is what's on main), publishes
# `guardrail` to npm. See CONTRIBUTING.md for how to add a changeset.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # apps/cli's own "prepublishOnly" script re-bundles guardrail into
          # a single self-contained file (see apps/cli/package.json) before
          # `changeset publish` runs `npm publish` — nothing extra needed here.
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
